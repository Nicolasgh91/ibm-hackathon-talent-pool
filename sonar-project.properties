# Configuración de SonarQube / SonarCloud para proyecto Quarkus + React.
# Referencia: ARCHITECTURE.md §10.5
# Ajustar sonar.projectKey y sonar.organization a los valores reales del proyecto.

sonar.projectKey=tu-org_tu-proyecto
sonar.organization=tu-org
sonar.projectName=tu-proyecto
sonar.projectVersion=1.0

# ===================================================================
# fuentes y exclusiones
# ===================================================================
sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test,frontend/tests

# Archivos generados y artefactos: fuera del análisis.
sonar.exclusions=\
    **/node_modules/**,\
    **/dist/**,\
    **/build/**,\
    **/target/**,\
    **/*.generated.*,\
    backend/src/main/resources/META-INF/openapi.yaml,\
    frontend/coverage/**,\
    frontend/playwright-report/**

# Tests: se analizan pero no cuentan a la cobertura ni a duplicación.
sonar.coverage.exclusions=\
    **/test/**,\
    **/tests/**,\
    **/*.test.ts,\
    **/*.test.tsx,\
    **/*.spec.ts,\
    **/*.spec.tsx,\
    backend/src/main/java/**/Application.java,\
    frontend/src/main.tsx

sonar.cpd.exclusions=\
    backend/src/main/resources/db/migration/**,\
    **/*.test.*,\
    **/*.spec.*

# ===================================================================
# configuración Java
# ===================================================================
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/dependency/*.jar
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=backend/target/surefire-reports,backend/target/failsafe-reports

# ===================================================================
# configuración TypeScript / JavaScript
# ===================================================================
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# ===================================================================
# encoding y SCM
# ===================================================================
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# ===================================================================
# quality gate
# ===================================================================
# El quality gate se configura en la UI de SonarQube/SonarCloud.
# Recomendación según ARCHITECTURE.md §10.5:
#
# Fase 0 a 2 (gate suave, no bloqueante):
#   - 0 vulnerabilidades nuevas
#   - cobertura de código nuevo ≥ 60%
#
# Fase 3 en adelante (gate bloqueante):
#   - 0 vulnerabilidades nuevas
#   - 0 bugs nuevos high/critical
#   - cobertura de código nuevo ≥ 80%
#   - duplicación de código nuevo < 3%
#   - ratio de deuda técnica < 5%
