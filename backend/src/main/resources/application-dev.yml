# =============================================================================
# Talent Pool - Development Profile (Dev Services)
# =============================================================================
# This profile is automatically activated when running `mvn quarkus:dev`
# Dev Services provision PostgreSQL and Redis. Chat uses mock LLM unless use-mock-llm is false and OPENAI is configured.
# =============================================================================

quarkus:
  http:
    cors:
      # Same-origin from the browser's perspective: localhost and 127.0.0.1 differ; cover both for Vite.
      origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
  langchain4j:
    chat-model:
      provider: openai
    openai:
      api-key: ${OPENAI_API_KEY:dev-key-not-used}
      enable-integration: false
  # Dev Services - Automatic Container Provisioning
  devservices:
    enabled: ${QUARKUS_DEVSERVICES_ENABLED:false}
  
  # PostgreSQL: credenciales por defecto alineadas a infra/compose/docker-compose.dev.yml.
  # jdbc.url explícito desactiva JDBC Dev Services; sin él y con devservices.enabled, Quarkus levanta PG.
  datasource:
    username: ${DB_USERNAME:talentpool}
    password: ${DB_PASSWORD:talentpool_dev_pass}
    jdbc:
      url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/talentpool_dev}
    devservices:
      enabled: true
      image-name: pgvector/pgvector:pg16
      port: 5432
      db-name: talentpool_dev
      username: talentpool
      password: talentpool_dev_pass
      init-script-path: db/dev-init.sql
      volumes:
        "/var/lib/postgresql/data": pgdata-dev
      command: >
        postgres
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c maintenance_work_mem=128MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=8MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
      properties:
        "quarkus.datasource.jdbc.additional-jdbc-properties.stringtype": "unspecified"
  
  # Redis Dev Services
  redis:
    devservices:
      enabled: true
      image-name: redis:7-alpine
      port: 6379
      shared: true
  
  # Hibernate - Verbose logging in dev
  hibernate-orm:
    log:
      sql: true
      bind-parameters: true
      format-sql: true
  
  # Flyway - Clean database on restart (dev only!)
  flyway:
    clean-at-start: false  # Set to true if you want fresh DB on each restart
    baseline-on-migrate: true
  
  # Logging — usar category.<name>.level (map anidada). El atajo 'nombre': DEBUG en YAML
  # puede producir claves inválidas y Quarkus ignora esas categorías.
  log:
    level: INFO
    min-level: TRACE
    category:
      com.talentpool:
        level: DEBUG
      io.quarkus:
        level: INFO
      org.hibernate.SQL:
        level: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder:
        level: TRACE
      org.flywaydb:
        level: DEBUG
      dev.langchain4j:
        level: DEBUG
      # JDK bridge (JBossSystemLogger): sin esto puede seguir en DEBUG aunque el root sea INFO.
      "java.lang.ProcessBuilder":
        level: INFO
    console:
      color: true
  
  # Live Reload
  live-reload:
    enabled: true
    instrumentation: true
  
  # Dev UI
  dev-ui:
    enabled: true
  
  # OpenAPI - Include all endpoints in dev
  smallrye-openapi:
    servers:
      - url: http://localhost:8080
        description: Development server (Dev Services)
  
  # Health checks - Show all details in dev
  smallrye-health:
    ui:
      enable: true

# =============================================================================
# Application - Development Overrides
# =============================================================================
app:
  llm:
    provider: mock
    use-mock-llm: true
    cost-per-1k-tokens:
      input: 0.0  # Free!
      output: 0.0
  
  security:
    rate-limiting:
      enabled: false  # Disable rate limiting in dev
  
  email:
    provider: console  # Log emails to console instead of sending
  
  storage:
    provider: local
    local:
      base-path: ${user.home}/.talentpool/storage-dev
  
  features:
    email-notifications: false  # Don't send real emails in dev

