# =============================================================================
# Talent Pool - Test Profile (@QuarkusTest)
# =============================================================================
# Sin Docker/Testcontainers: Dev Services desactivados; usar PostgreSQL local
# (puerto 5432) con BD y credenciales alineadas a DB_* / JDBC URL abajo.
# Con Docker funcional: QUARKUS_DEVSERVICES_ENABLED=true para contenedores de test.
# =============================================================================

quarkus:
  devservices:
    enabled: ${QUARKUS_DEVSERVICES_ENABLED:false}

  datasource:
    devservices:
      enabled: ${QUARKUS_DEVSERVICES_ENABLED:false}
    db-kind: postgresql
    # Misma instancia que compose dev; crear BD `talentpool_test` una vez si no existe.
    username: ${DB_USERNAME:talentpool}
    password: ${DB_PASSWORD:talentpool_dev_pass}
    jdbc:
      url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/talentpool_test}

  redis:
    devservices:
      enabled: ${QUARKUS_DEVSERVICES_ENABLED:false}

  # Cache apunta a Redis en application.yml; sin Redis local desactivamos caché en tests.
  cache:
    enabled: false

  flyway:
    clean-at-start: true
    clean-disabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/test-data

  hibernate-orm:
    log:
      sql: false
      bind-parameters: false

  log:
    level: WARN
    category:
      "com.talentpool":
        level: INFO
      "io.quarkus":
        level: WARN
      "org.hibernate":
        level: WARN
      "org.flywaydb":
        level: INFO
    console:
      enable: true
      format: "%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n"

  transaction-manager:
    default-transaction-timeout: 30s

# JWT: smallrye.jwt.* y mp.jwt.* en application.yml (raíz), se fusionan con este perfil.

langchain4j:
  openai:
    api-key: test-key-not-used
  ollama:
    base-url: http://localhost:11434

app:
  llm:
    provider: mock

  security:
    password:
      iterations: 1
      memory-kb: 1024
    rate-limiting:
      enabled: false

  email:
    provider: mock

  storage:
    provider: memory

  features:
    email-notifications: false
    real-time-updates: false
